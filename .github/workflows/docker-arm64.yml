# The fork's only workflow: one arm64 image, pushed to this repository's GHCR.
# Built from upstream's own Dockerfile.build and docker-bake.hcl, unchanged, so
# rebasing onto upstream does not touch the build.
#
# Target is aarch64 musl (Alpine runtime image): the glibc target also builds a
# second FoundationDB binary that this image would not use, doubling the time.
name: Docker arm64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "img/**", "LICENSES/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      TARGET: aarch64-unknown-linux-musl
      SUFFIX: "-alpine"
      BUILD_ENV: "JEMALLOC_SYS_WITH_LG_PAGE=16 "
      DOCKER_PLATFORM: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /mnt /

      - name: Add swap
        run: |
          swap_dir=""
          for dir in /mnt /; do
            if [ -d "$dir" ] && [ "$(df --output=avail -k "$dir" | tail -1)" -ge 18874368 ]; then
              swap_dir="$dir"; break
            fi
          done
          [ -n "$swap_dir" ] || { echo "No room for swap"; df -h; exit 1; }
          sudo fallocate -l 16G "${swap_dir%/}/swapfile"
          sudo chmod 600 "${swap_dir%/}/swapfile"
          sudo mkswap "${swap_dir%/}/swapfile"
          sudo swapon "${swap_dir%/}/swapfile"
          sudo sysctl vm.swappiness=80
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]
          driver-opts: |
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=arm64
            type=sha,prefix=arm64-

      - name: Build and push
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_REPO: ${{ env.IMAGE }}
        with:
          source: .
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build,image
          set: |
            image.output=type=image,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "docker pull ${IMAGE}:arm64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
